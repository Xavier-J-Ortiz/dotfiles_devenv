font_family      family="Mononoki Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto

# Work around Shift+Enter not reaching OpenCode through Kitty -> tmux 3.5a.
# Remove after verifying this path works without the mapping on newer versions.
map --when-focus-on title:^opencode$ shift+enter send_text normal,application \e[13;2u
